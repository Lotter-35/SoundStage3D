<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Sound System Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "lil-gui": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js"
        }
    }
    </script>
</head>
<body>
    <div id="hud">
        <div id="hud-center">
        </div>
        <div id="hud-right">
            <button id="dsp-btn" class="hud-btn active">⚙️ Options</button>
            <button id="play-btn" class="hud-btn">⏸ Pause</button>
            <button id="change-mp3-btn" class="hud-btn">📂 Changer MP3</button>
            <button id="debug-btn" class="hud-btn">🐛 Debug</button>
        </div>
        <!-- Oscilloscope canvas -->
        <canvas id="oscilloscope" class="hidden" width="900" height="160"></canvas>
        <div id="hud-bottom">
            <span>ZQSD / WASD / Flèches : se déplacer &nbsp;|&nbsp; Souris : regarder &nbsp;|&nbsp; Space / Shift : monter / descendre &nbsp;|&nbsp; F : mode personnage &nbsp;|&nbsp; TAB / ÉCHAP : libérer la souris</span>
        </div>
        <!-- Level meters (top-left, inside HUD so only visible in-game) -->
        <div id="meters">
            <div id="position-display">X: 0 &nbsp; Y: 1.7 &nbsp; Z: 50</div>
            <div id="meters-tracks">
            <div class="meter" id="meter-sub">
                <div class="meter-label">SUB</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-mid">
                <div class="meter-label">MID</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-top">
                <div class="meter-label">TOP</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-fill">
                <div class="meter-label">FILL</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-master">
                <div class="meter-label">OUT</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            </div>
        </div>
    </div>

    <!-- Debug performance overlay -->
    <div id="debug-panel" class="hidden">
        <div id="debug-content"></div>
    </div>

    <div id="now-playing"></div>
    <div id="fps-counter"></div>

    <canvas id="canvas"></canvas>

    <script type="module" src="src/main.js"></script>
</body>
</html>
