<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Sound System Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "lil-gui": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js"
        }
    }
    </script>
</head>
<body>
    <div id="hud">
        <div id="hud-center">
        </div>
        <div id="hud-right">
            <div id="cones-dropdown" class="dropdown">
                <button id="cones-btn" class="hud-btn">💠 Cônes ▾</button>
                <div id="cones-menu" class="dropdown-menu">
                    <label><input type="checkbox" data-cone-bus="all"> Tous</label>
                    <label><input type="checkbox" data-cone-bus="sub"> SUB</label>
                    <label><input type="checkbox" data-cone-bus="mid"> MID</label>
                    <label><input type="checkbox" data-cone-bus="top"> TOP</label>
                    <label><input type="checkbox" data-cone-bus="fill"> FILL</label>
                </div>
            </div>
            <button id="dsp-btn" class="hud-btn">🎛 DSP</button>
            <div id="hrtf-wrapper">
                <button id="hrtf-btn" class="hud-btn">🎧 HRTF: OFF</button>
                <div id="hrtf-comp" class="hud-slider-drop hidden">
                    <label>✨ Brillance <input type="range" id="hrtf-brightness" min="0" max="12" step="0.5" value="4" data-default="4"><span id="hrtf-brightness-val">+4 dB</span></label>
                </div>
            </div>
            <button id="doppler-btn" class="hud-btn">🔇 Doppler: OFF</button>
            <button id="oscilloscope-btn" class="hud-btn">📈 Oscillo: OFF</button>
            <button id="grass-btn" class="hud-btn">🌿 Herbe: OFF</button>
            <button id="play-btn" class="hud-btn">⏸ Pause</button>
            <button id="change-mp3-btn" class="hud-btn">📂 Changer MP3</button>
            <button id="debug-btn" class="hud-btn">🐛 Debug</button>
        </div>
        <!-- Oscilloscope canvas -->
        <canvas id="oscilloscope" class="hidden" width="900" height="160"></canvas>
        <div id="sine-btn-wrap">
            <button id="sine-btn" class="hud-btn">🔊 Générateur Sinus ▾</button>
        </div>
        <div id="hud-bottom">
            <span>ZQSD / WASD / Flèches : se déplacer &nbsp;|&nbsp; Souris : regarder &nbsp;|&nbsp; Space / Shift : monter / descendre &nbsp;|&nbsp; F : mode personnage &nbsp;|&nbsp; TAB / ÉCHAP : libérer la souris</span>
        </div>
        <!-- Level meters (top-left, inside HUD so only visible in-game) -->
        <div id="meters">
            <div id="position-display">X: 0 &nbsp; Y: 1.7 &nbsp; Z: 50</div>
            <div id="meters-tracks">
            <div class="meter" id="meter-sub">
                <div class="meter-label">SUB</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-mid">
                <div class="meter-label">MID</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-top">
                <div class="meter-label">TOP</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-fill">
                <div class="meter-label">FILL</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            <div class="meter" id="meter-master">
                <div class="meter-label">OUT</div>
                <div class="meter-track"><div class="meter-fill"></div><div class="meter-peak"></div></div>
                <div class="meter-clip">CLIP</div>
            </div>
            </div>
        </div>
    </div>

    <!-- ─── Tooltip container for DSP parameters ─── -->
    <div id="dsp-tooltip"></div>

    <!-- ─── Master & Environnement Panel (en haut à droite, indépendant) ─── -->
    <div id="dsp-master-wrap" class="hidden">
        <div id="dsp-panel-master"></div>
    </div>

    <!-- ─── DSP Panels (per-bus pipeline controls in bottom bar) ─── -->
    <div id="dsp-panels" class="hidden">
        <div id="dsp-panel-top" class="dsp-panel-slot"></div>
        <div id="dsp-panel-mid" class="dsp-panel-slot"></div>
        <div class="dsp-spacer"></div>
        <div id="dsp-panel-fill" class="dsp-panel-slot"></div>
        <div id="dsp-panel-sub" class="dsp-panel-slot"></div>
    </div>

    <!-- ─── Sine Generator Panel (en bas au centre) ─── -->
    <div id="sine-panel-wrap" class="hidden">
        <div id="sine-panel"></div>
    </div>

    <!-- Debug performance overlay -->
    <div id="debug-panel" class="hidden">
        <div id="debug-content"></div>
    </div>

    <div id="now-playing"></div>
    <div id="fps-counter">60 FPS</div>

    <canvas id="canvas"></canvas>

    <script type="module" src="src/main.js"></script>
</body>
</html>
